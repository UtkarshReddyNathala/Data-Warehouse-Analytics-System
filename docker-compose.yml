# Runs SQL Server 2022 (free Developer edition) in Docker, with SQL Server Agent switched on
# because CDC needs it. The project folder is shared read-only at /dwh so SQL Server can
# read the CSV files.
#
#   cp .env.example .env        # set your own SA password
#   ./deploy/deploy.sh          # start, create the database, deploy, run the pipeline
#
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dwh-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - ./:/dwh:ro
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mssql-data:
